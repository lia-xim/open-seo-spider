name: Rust checks
on:
  push:
  pull_request:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/container-e2e.mjs
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --locked -p open-seo-spider
      - run: node scripts/api-e2e.mjs
      - run: node scripts/list-import-e2e.mjs
      - run: node scripts/crawl-control-e2e.mjs
      - run: node scripts/selected-recrawl-e2e.mjs
      - run: node scripts/crawl-policy-e2e.mjs
      - run: node scripts/content-analysis-e2e.mjs
      - run: node scripts/content-capture-e2e.mjs
      - run: node scripts/resource-discovery-e2e.mjs
      - run: npm ci --ignore-scripts
        working-directory: scripts
      - run: node scripts/mcp-e2e.mjs
      - run: node scripts/saved-comparison-e2e.mjs
      - name: Saved-comparison mapping oracle negative controls
        run: node --test scripts/saved-comparison-mapping-oracles.test.mjs
        env:
          SPIDER_COMPARISON_MAPPING_CONTROL_PROOF: ${{ runner.temp }}/saved-comparison-mapping-oracle-controls.json
      - name: Native saved-comparison cross-origin mappings and collisions
        run: node scripts/saved-comparison-mapping-e2e.mjs
        env:
          SPIDER_BINARY: ${{ runner.os == 'Windows' && 'target/debug/open-seo-spider.exe' || 'target/debug/open-seo-spider' }}
          SPIDER_COMPARISON_MAPPING_PROOF: ${{ runner.temp }}/saved-comparison-mapping-e2e.json
          SPIDER_COMPARISON_MAPPING_CONTROL_PROOF: ${{ runner.temp }}/saved-comparison-mapping-oracle-controls.json
      - run: node scripts/resource-contract-e2e.mjs
      - name: Original-report bundle oracle negative controls
        run: node --test scripts/saved-comparison-bundle-oracles.test.mjs
        env:
          SPIDER_BUNDLE_CONTROL_PROOF: ${{ runner.temp }}/saved-comparison-original-bundle-oracle-controls.json
      - name: Native saved-comparison complete original reports
        run: node scripts/saved-comparison-bundle-e2e.mjs
        env:
          SPIDER_BINARY: ${{ runner.os == 'Windows' && 'target/debug/open-seo-spider.exe' || 'target/debug/open-seo-spider' }}
          SPIDER_BUNDLE_PROOF: ${{ runner.temp }}/saved-comparison-original-bundle-e2e.json
          SPIDER_BUNDLE_CONTROL_PROOF: ${{ runner.temp }}/saved-comparison-original-bundle-oracle-controls.json
      - name: Native CLI original-report bundle fixed byte ceiling
        run: node scripts/saved-comparison-bundle-budget-e2e.mjs
        env:
          SPIDER_BINARY: ${{ github.workspace }}/${{ runner.os == 'Windows' && 'target/debug/open-seo-spider.exe' || 'target/debug/open-seo-spider' }}
          SPIDER_BUNDLE_BUDGET_PROOF: ${{ runner.temp }}/saved-comparison-original-bundle-cli-budget.json
      - name: Build immutable optimized Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseSourcePaths=@('Cargo.toml','Cargo.lock','crates/core/src','crates/app/src','crates/core/Cargo.toml','crates/app/Cargo.toml','assets','web/index.html','web/app.js','web/saved-comparison.js','web/styles.css','web/list-import.js','web/serp.html','web/serp.js','web/robots.html','web/robots.js')
          git diff --quiet HEAD -- $releaseSourcePaths
          if($LASTEXITCODE -ne 0){throw 'Compiled source differs from the exact CI commit'}
          cargo build --release --locked -p open-seo-spider
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          git diff --quiet HEAD -- $releaseSourcePaths
          if($LASTEXITCODE -ne 0){throw 'Compiled source changed during release build'}
      - name: Verify optimized Windows original-report bundle
        if: runner.os == 'Windows'
        run: node scripts/saved-comparison-bundle-e2e.mjs
        env:
          SPIDER_BINARY: target/release/open-seo-spider.exe
          SPIDER_BUNDLE_PROOF: ${{ runner.temp }}/saved-comparison-original-bundle-release-e2e.json
          SPIDER_BUNDLE_CONTROL_PROOF: ${{ runner.temp }}/saved-comparison-original-bundle-oracle-controls.json
      - name: Verify optimized Windows bundle byte ceiling
        if: runner.os == 'Windows'
        run: node scripts/saved-comparison-bundle-budget-e2e.mjs
        env:
          SPIDER_BINARY: ${{ github.workspace }}/target/release/open-seo-spider.exe
          SPIDER_BUNDLE_BUDGET_PROOF: ${{ runner.temp }}/saved-comparison-original-bundle-release-cli-budget.json
      - name: Bind the optimized Windows artifact to its source and tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseCommit=(git rev-parse HEAD).Trim()
          if($releaseCommit -ne $env:GITHUB_SHA){throw 'Unexpected artifact source commit'}
          $releaseExe=Join-Path (Get-Location) 'target/release/open-seo-spider.exe'
          $releaseBundleProof=Join-Path $env:RUNNER_TEMP 'saved-comparison-original-bundle-release-e2e.json'
          $releaseBudgetProof=Join-Path $env:RUNNER_TEMP 'saved-comparison-original-bundle-release-cli-budget.json'
          $releaseHash=(Get-FileHash -LiteralPath $releaseExe -Algorithm SHA256).Hash.ToLowerInvariant()
          foreach($releaseProofPath in @($releaseBundleProof,$releaseBudgetProof)){
            $releaseProof=Get-Content -LiteralPath $releaseProofPath -Raw | ConvertFrom-Json
            if($releaseProof.result -ne 'PASS' -or $releaseProof.binary_sha256 -ne $releaseHash){throw 'Optimized proof/binary mismatch'}
          }
          $releaseManifest=@{source_commit=$releaseCommit;run_id=$env:GITHUB_RUN_ID;profile='release';platform='windows-x86_64-msvc';binary_sha256=$releaseHash;binary_bytes=(Get-Item -LiteralPath $releaseExe).Length;rustc=(rustc --version);bundle_proof_sha256=(Get-FileHash -LiteralPath $releaseBundleProof -Algorithm SHA256).Hash.ToLowerInvariant();budget_proof_sha256=(Get-FileHash -LiteralPath $releaseBudgetProof -Algorithm SHA256).Hash.ToLowerInvariant();scope='Optimized executable from exact CI source; native bundle and CLI ceiling pass. Local browser/install and all other CI jobs are separate gates.'}
          $releaseArtifactFolder=Join-Path (Get-Location) 'target/release-artifact'
          New-Item -ItemType Directory -Path $releaseArtifactFolder -Force | Out-Null
          $releaseManifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $releaseArtifactFolder 'open-seo-spider-windows-release.json') -Encoding utf8NoBOM
          Copy-Item -LiteralPath $releaseExe -Destination $releaseArtifactFolder
          Copy-Item -LiteralPath $releaseBundleProof -Destination $releaseArtifactFolder
          Copy-Item -LiteralPath $releaseBudgetProof -Destination $releaseArtifactFolder
      - name: Save the private optimized Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: open-seo-spider-windows-release-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: target/release-artifact/*
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --ignore-scripts
        working-directory: renderer
      - run: node node_modules/playwright-core/cli.js install chromium --with-deps
        working-directory: renderer
      - name: Select the matching installed Playwright Chromium
        working-directory: renderer
        run: node --input-type=module -e 'import {chromium} from "playwright-core"; import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_ENV, `OPEN_SEO_BROWSER_PATH=${chromium.executablePath()}\n`);'
      - name: Allow the selected Chromium to create its Linux sandbox
        shell: bash
        run: |
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            # Exact downloaded executable only; Chromium sandbox remains enabled.
            sudo tee /etc/apparmor.d/open-seo-spider-ci-chromium > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile open-seo-spider-ci-chromium "$OPEN_SEO_BROWSER_PATH" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/open-seo-spider-ci-chromium
          fi
      - run: npm test
        working-directory: renderer
      - run: node web/verification/ui-smoke.cjs
      - run: node web/verification/ui-crawl-control-smoke.cjs
      - run: node web/verification/ui-selected-recrawl-smoke.cjs
      - run: node web/verification/ui-policy-smoke.cjs
      - run: node web/verification/ui-content-smoke.cjs
      - run: node web/verification/ui-resource-discovery-smoke.cjs
      - run: node web/verification/ui-resource-ledger-smoke.cjs
      - run: node web/verification/ui-resource-contract-smoke.cjs
      - run: node web/verification/saved-comparison-contract.test.cjs
      - run: node web/verification/saved-comparison-native-fence.test.cjs
      - run: node web/verification/saved-comparison-bundle-native-fence.test.cjs
      - run: node web/verification/ui-saved-comparison-smoke.cjs
      - run: node scripts/update-feature-todo.mjs --check
      - run: node --test web/verification/serp-state-race.test.cjs
      - run: node --test web/verification/robots-input-state.test.cjs
      - run: node --test web/verification/list-import-state.test.mjs
      - run: cargo build --locked -p open-seo-spider
      - name: Native saved-comparison browser and offline restart
        run: node web/verification/ui-saved-comparison-live.cjs
        env:
          SPIDER_BINARY: target/debug/open-seo-spider
          SPIDER_COMPARISON_UI_PROOF: ${{ runner.temp }}/saved-comparison-ui-native.json
      - name: Native optional-original-report browser export and offline restart
        run: node web/verification/ui-saved-comparison-bundle-live.cjs
        env:
          SPIDER_BINARY: target/debug/open-seo-spider
          SPIDER_UI_PROOF: ${{ runner.temp }}/saved-comparison-original-bundle-ui-native.json
      - name: Rust and browser integration
        shell: bash
        run: |
          node renderer/server.mjs > "$RUNNER_TEMP/renderer.log" 2>&1 &
          renderer_pid=$!
          target/debug/open-seo-spider serve --listen 127.0.0.1:8787 --data-dir "$RUNNER_TEMP/spider-data" > "$RUNNER_TEMP/spider.log" 2>&1 &
          spider_pid=$!
          target/debug/open-seo-spider serve --listen 127.0.0.1:18789 --data-dir "$RUNNER_TEMP/spider-contract-data" > "$RUNNER_TEMP/spider-contract.log" 2>&1 &
          contract_pid=$!
          trap 'kill "$contract_pid" "$spider_pid" "$renderer_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'const urls=["http://127.0.0.1:8787/healthz","http://127.0.0.1:18789/healthz","http://127.0.0.1:8790/health"];for(const url of urls){let ready=false;for(let i=0;i<80;i++){try{if((await fetch(url)).ok){ready=true;break}}catch{}await new Promise(r=>setTimeout(r,250))}if(!ready)throw new Error(`Service unavailable: ${url}`)}'
          cargo test --locked -p open-seo-spider-core --test crawl_fixtures live_browser_worker_executes_javascript_for_core_crawl -- --ignored
          cargo test --locked -p open-seo-spider-core --test control_fixtures live_browser_worker_pause_drains_render_and_retains_rendered_discoveries -- --ignored
          cargo test --locked -p open-seo-spider-core --test recrawl_fixtures live_browser_worker_selected_recrawl_replaces_rendered_artifacts_without_expansion -- --ignored
          cargo test --locked -p open-seo-spider-core --test content_capture_fixtures live_browser_worker_captures_actual_raw_and_rendered_sources_and_selected_freshness -- --ignored --exact
          node web/verification/ui-renderer-live.cjs
          node web/verification/ui-serp-live.cjs
          node web/verification/ui-resource-live.cjs
          node web/verification/ui-dom-live.cjs
          node web/verification/ui-robots-live.cjs
          node web/verification/ui-list-import-live.cjs
          node web/verification/ui-crawl-control-live.cjs
          node web/verification/ui-selected-recrawl-live.cjs
          node web/verification/ui-policy-live.cjs
          node web/verification/ui-content-live.cjs
          SPIDER_APP_URL=http://127.0.0.1:8787 node web/verification/ui-resource-discovery-live.cjs
          SPIDER_APP_URL=http://127.0.0.1:18789 node web/verification/ui-resource-contract-live.cjs
