[package]
name = "open-seo-spider"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
languagetool-integration = []

[dependencies]
open-seo-spider-core = { path = "../core" }
anyhow = "1"
base64 = "0.22"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
hyper-util = { version = "=0.1.21", default-features = false, features = ["server", "http1", "service", "tokio"] }
sha2 = "0.10"

[dev-dependencies]
csv = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
tempfile = "3"
